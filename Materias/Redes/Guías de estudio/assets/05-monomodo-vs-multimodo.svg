<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" role="img" aria-label="Fibra monomodo vs multimodo: corte y propagación de rayos">
  <style>
    .t{font-family:sans-serif;font-size:12px;font-weight:bold;fill:#333}
    .s{font-family:sans-serif;font-size:11px;fill:#333}
    .ss{font-family:sans-serif;font-size:10px;fill:#555}
    .cladding{fill:#e0f7fa;stroke:#00796b;stroke-width:1.5}
    .core-mm{fill:#ffe0b2;stroke:#e65100;stroke-width:1.5}
    .core-sm{fill:#bbdefb;stroke:#0d47a1;stroke-width:1.5}
    .ray{stroke:#c62828;stroke-width:1.5;fill:none}
    .ray-sm{stroke:#1565c0;stroke-width:2;fill:none}
  </style>

  <!-- MULTIMODO -->
  <g transform="translate(20,40)">
    <text x="320" y="0" text-anchor="middle" class="t">Multimodo (OM) — núcleo ancho, varios rayos, corta distancia</text>
    <!-- Corte transversal -->
    <text x="60" y="20" text-anchor="middle" class="ss">corte</text>
    <circle class="cladding" cx="60" cy="65" r="45"/>
    <circle class="core-mm" cx="60" cy="65" r="30"/>
    <text x="60" y="130" text-anchor="middle" class="ss">núcleo grueso</text>
    <text x="60" y="143" text-anchor="middle" class="ss">50–62.5 µm</text>

    <!-- Vista lateral con múltiples rayos -->
    <text x="380" y="20" text-anchor="middle" class="ss">propagación de la luz</text>
    <rect class="cladding" x="140" y="40" width="470" height="60"/>
    <rect class="core-mm" x="140" y="55" width="470" height="30"/>
    <!-- Rayos rebotando -->
    <polyline class="ray" points="140,70 200,58 260,82 320,58 380,82 440,58 500,82 560,58 610,70"/>
    <polyline class="ray" points="140,70 220,80 300,60 380,80 460,60 540,80 610,70"/>
    <polyline class="ray" points="140,70 240,60 340,80 440,60 540,80 610,70"/>
    <text x="380" y="120" text-anchor="middle" class="ss" fill="#c62828">Múltiples caminos → los rayos "se desparraman" (dispersión) → alcance corto</text>
    <text x="380" y="138" text-anchor="middle" class="ss">Uso: LAN, centros de datos (hasta cientos de metros).</text>
  </g>

  <!-- MONOMODO -->
  <g transform="translate(20,180)">
    <text x="320" y="0" text-anchor="middle" class="t">Monomodo (OS) — núcleo finito, un solo rayo, largas distancias</text>
    <!-- Corte transversal -->
    <text x="60" y="20" text-anchor="middle" class="ss">corte</text>
    <circle class="cladding" cx="60" cy="65" r="45"/>
    <circle class="core-sm" cx="60" cy="65" r="10"/>
    <text x="60" y="130" text-anchor="middle" class="ss">núcleo finito ~9 µm</text>

    <!-- Vista lateral con un rayo casi recto -->
    <rect class="cladding" x="140" y="40" width="470" height="60"/>
    <rect class="core-sm" x="140" y="65" width="470" height="10"/>
    <line class="ray-sm" x1="140" y1="70" x2="610" y2="70"/>
    <text x="380" y="120" text-anchor="middle" class="ss" fill="#1565c0">Un solo modo → sin dispersión → alcance largo (km a decenas de km)</text>
    <text x="380" y="138" text-anchor="middle" class="ss">Uso: WAN, backbones, entre ciudades. Conector típicamente azul (UPC) o verde (APC).</text>
  </g>
</svg>
