<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="100%" role="img" aria-label="Arquitectura spine-leaf de data center y camino redundante A/B">
  <style>
    .t{font-family:sans-serif;font-size:12px;font-weight:bold;fill:#333}
    .s{font-family:sans-serif;font-size:11px;fill:#333}
    .ss{font-family:sans-serif;font-size:10px;fill:#555}
    .spine{fill:#c62828;stroke:#8e0000;stroke-width:1.5}
    .leaf{fill:#1976d2;stroke:#0d47a1;stroke-width:1.5}
    .srv{fill:#e3f2fd;stroke:#455a64;stroke-width:1}
    .link{stroke:#455a64;stroke-width:1;fill:none}
    .A{stroke:#2e7d32;stroke-width:1.5;fill:none;stroke-dasharray:3,3}
    .B{stroke:#7b1fa2;stroke-width:1.5;fill:none;stroke-dasharray:3,3}
  </style>

  <text x="360" y="20" text-anchor="middle" class="t">Arquitectura spine-leaf típica de un data center moderno</text>

  <!-- Spines -->
  <text x="60" y="60" text-anchor="middle" class="s" fill="#c62828">SPINE</text>
  <rect class="spine" x="180" y="45" width="90" height="30" rx="5"/><text x="225" y="65" text-anchor="middle" class="s" fill="#fff">Spine 1</text>
  <rect class="spine" x="320" y="45" width="90" height="30" rx="5"/><text x="365" y="65" text-anchor="middle" class="s" fill="#fff">Spine 2</text>
  <rect class="spine" x="460" y="45" width="90" height="30" rx="5"/><text x="505" y="65" text-anchor="middle" class="s" fill="#fff">Spine 3</text>
  <rect class="spine" x="600" y="45" width="90" height="30" rx="5"/><text x="645" y="65" text-anchor="middle" class="s" fill="#fff">Spine 4</text>

  <!-- Leaves -->
  <text x="60" y="180" text-anchor="middle" class="s" fill="#1976d2">LEAF</text>
  <rect class="leaf" x="130" y="160" width="70" height="26" rx="4"/><text x="165" y="177" text-anchor="middle" class="s" fill="#fff">Leaf 1</text>
  <rect class="leaf" x="230" y="160" width="70" height="26" rx="4"/><text x="265" y="177" text-anchor="middle" class="s" fill="#fff">Leaf 2</text>
  <rect class="leaf" x="330" y="160" width="70" height="26" rx="4"/><text x="365" y="177" text-anchor="middle" class="s" fill="#fff">Leaf 3</text>
  <rect class="leaf" x="430" y="160" width="70" height="26" rx="4"/><text x="465" y="177" text-anchor="middle" class="s" fill="#fff">Leaf 4</text>
  <rect class="leaf" x="530" y="160" width="70" height="26" rx="4"/><text x="565" y="177" text-anchor="middle" class="s" fill="#fff">Leaf 5</text>

  <!-- Enlaces spine-leaf (todos con todos) -->
  <g class="link">
    <!-- Spine 1 -->
    <line x1="225" y1="75" x2="165" y2="160"/><line x1="225" y1="75" x2="265" y2="160"/><line x1="225" y1="75" x2="365" y2="160"/><line x1="225" y1="75" x2="465" y2="160"/><line x1="225" y1="75" x2="565" y2="160"/>
    <line x1="365" y1="75" x2="165" y2="160"/><line x1="365" y1="75" x2="265" y2="160"/><line x1="365" y1="75" x2="365" y2="160"/><line x1="365" y1="75" x2="465" y2="160"/><line x1="365" y1="75" x2="565" y2="160"/>
    <line x1="505" y1="75" x2="165" y2="160"/><line x1="505" y1="75" x2="265" y2="160"/><line x1="505" y1="75" x2="365" y2="160"/><line x1="505" y1="75" x2="465" y2="160"/><line x1="505" y1="75" x2="565" y2="160"/>
    <line x1="645" y1="75" x2="165" y2="160"/><line x1="645" y1="75" x2="265" y2="160"/><line x1="645" y1="75" x2="365" y2="160"/><line x1="645" y1="75" x2="465" y2="160"/><line x1="645" y1="75" x2="565" y2="160"/>
  </g>

  <!-- Servidores debajo -->
  <g>
    <rect class="srv" x="140" y="220" width="50" height="18" rx="2"/><text x="165" y="233" text-anchor="middle" class="ss">srv</text>
    <rect class="srv" x="140" y="242" width="50" height="18" rx="2"/><text x="165" y="255" text-anchor="middle" class="ss">srv</text>
    <rect class="srv" x="240" y="220" width="50" height="18" rx="2"/><text x="265" y="233" text-anchor="middle" class="ss">srv</text>
    <rect class="srv" x="240" y="242" width="50" height="18" rx="2"/><text x="265" y="255" text-anchor="middle" class="ss">srv</text>
    <rect class="srv" x="340" y="220" width="50" height="18" rx="2"/><text x="365" y="233" text-anchor="middle" class="ss">srv</text>
    <rect class="srv" x="340" y="242" width="50" height="18" rx="2"/><text x="365" y="255" text-anchor="middle" class="ss">srv</text>
    <rect class="srv" x="440" y="220" width="50" height="18" rx="2"/><text x="465" y="233" text-anchor="middle" class="ss">srv</text>
    <rect class="srv" x="440" y="242" width="50" height="18" rx="2"/><text x="465" y="255" text-anchor="middle" class="ss">srv</text>
    <rect class="srv" x="540" y="220" width="50" height="18" rx="2"/><text x="565" y="233" text-anchor="middle" class="ss">srv</text>
    <rect class="srv" x="540" y="242" width="50" height="18" rx="2"/><text x="565" y="255" text-anchor="middle" class="ss">srv</text>
  </g>

  <!-- Cables A/B -->
  <line class="A" x1="165" y1="186" x2="165" y2="220"/>
  <line class="B" x1="185" y1="186" x2="185" y2="220"/>
  <text x="620" y="235" text-anchor="middle" class="ss" fill="#2e7d32">— — Camino A</text>
  <text x="620" y="255" text-anchor="middle" class="ss" fill="#7b1fa2">— — Camino B</text>

  <text x="360" y="295" text-anchor="middle" class="ss">Cada leaf se conecta a TODOS los spines → múltiples caminos, sin cuellos de botella.</text>
  <text x="360" y="312" text-anchor="middle" class="ss">Cada servidor tiene dos "caminos" A/B (redundancia) con acometidas eléctricas y de red independientes.</text>
  <text x="360" y="329" text-anchor="middle" class="ss" font-style="italic">Reemplaza a la clásica jerarquía Core → Distribución → Acceso, mejor para tráfico "este-oeste" (VM ↔ VM).</text>
</svg>
