<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" role="img" aria-label="Random Forest: bootstrap + votación de árboles">
  <style>
    .t{font-family:sans-serif;font-size:12px;font-weight:bold;fill:#333}
    .s{font-family:sans-serif;font-size:11px;fill:#333}
    .node{fill:#e3f2fd;stroke:#1565c0;stroke-width:1.2}
    .leaf-yes{fill:#c8e6c9;stroke:#2e7d32;stroke-width:1.2}
    .leaf-no{fill:#ffcdd2;stroke:#c62828;stroke-width:1.2}
    .link{stroke:#555;stroke-width:1.2;fill:none}
    .box{fill:#fff8e1;stroke:#f9a825;stroke-width:1.5}
    .arr{stroke:#333;stroke-width:1.5;fill:none;marker-end:url(#a2)}
  </style>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="320" y="20" class="t" style="text-anchor:middle">Random Forest — muchos árboles con datos y variables distintas → se vota</text>

  <!-- Bag of data -->
  <g transform="translate(20,140)">
    <rect class="box" x="0" y="0" width="130" height="80"/>
    <text x="65" y="20" class="t" style="text-anchor:middle">Dataset</text>
    <text x="65" y="42" class="s" style="text-anchor:middle">Bootstrap (muestreo</text>
    <text x="65" y="56" class="s" style="text-anchor:middle">con reemplazo)</text>
    <text x="65" y="72" class="s" style="text-anchor:middle">+ subset de variables</text>
  </g>

  <path class="arr" d="M 155,180 L 235,62"/>
  <path class="arr" d="M 155,180 L 235,177"/>
  <path class="arr" d="M 155,180 L 235,292"/>

  <!-- Árbol 1 -->
  <g transform="translate(200,45)">
    <text x="60" y="0" class="s" style="text-anchor:middle">Árbol 1</text>
    <rect class="node" x="40" y="10" width="40" height="22" rx="3"/>
    <text x="60" y="26" class="s" style="text-anchor:middle">X&gt;5?</text>
    <line class="link" x1="55" y1="32" x2="30" y2="55"/>
    <line class="link" x1="65" y1="32" x2="90" y2="55"/>
    <rect class="leaf-yes" x="20" y="55" width="22" height="18" rx="3"/>
    <text x="31" y="68" class="s" style="text-anchor:middle">✓</text>
    <rect class="leaf-no" x="80" y="55" width="22" height="18" rx="3"/>
    <text x="91" y="68" class="s" style="text-anchor:middle">✗</text>
    <text x="60" y="90" class="s" style="fill:#2e7d32;font-weight:bold;text-anchor:middle">Vota: SÍ</text>
  </g>

  <!-- Árbol 2 -->
  <g transform="translate(200,160)">
    <text x="60" y="0" class="s" style="text-anchor:middle">Árbol 2</text>
    <rect class="node" x="40" y="10" width="40" height="22" rx="3"/>
    <text x="60" y="26" class="s" style="text-anchor:middle">Y&gt;3?</text>
    <line class="link" x1="55" y1="32" x2="30" y2="55"/>
    <line class="link" x1="65" y1="32" x2="90" y2="55"/>
    <rect class="leaf-yes" x="20" y="55" width="22" height="18" rx="3"/>
    <text x="31" y="68" class="s" style="text-anchor:middle">✓</text>
    <rect class="leaf-no" x="80" y="55" width="22" height="18" rx="3"/>
    <text x="91" y="68" class="s" style="text-anchor:middle">✗</text>
    <text x="60" y="90" class="s" style="fill:#c62828;font-weight:bold;text-anchor:middle">Vota: NO</text>
  </g>

  <!-- Árbol N -->
  <g transform="translate(200,275)">
    <text x="60" y="0" class="s" style="text-anchor:middle">... Árbol N</text>
    <rect class="node" x="40" y="10" width="40" height="22" rx="3"/>
    <text x="60" y="26" class="s" style="text-anchor:middle">Z&lt;7?</text>
    <line class="link" x1="55" y1="32" x2="30" y2="55"/>
    <line class="link" x1="65" y1="32" x2="90" y2="55"/>
    <rect class="leaf-yes" x="20" y="55" width="22" height="18" rx="3"/>
    <text x="31" y="68" class="s" style="text-anchor:middle">✓</text>
    <rect class="leaf-no" x="80" y="55" width="22" height="18" rx="3"/>
    <text x="91" y="68" class="s" style="text-anchor:middle">✗</text>
    <text x="60" y="90" class="s" style="fill:#2e7d32;font-weight:bold;text-anchor:middle">Vota: SÍ</text>
  </g>

  <!-- Voto -->
  <path class="arr" d="M 325,90 L 455,165"/>
  <path class="arr" d="M 325,205 L 455,180"/>
  <path class="arr" d="M 325,320 L 455,195"/>

  <g transform="translate(460,140)">
    <rect fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" x="0" y="0" width="150" height="80" rx="5"/>
    <text x="75" y="22" class="t" style="text-anchor:middle">🗳️ Votación</text>
    <text x="75" y="42" class="s" style="text-anchor:middle">La mayoría gana</text>
    <text x="75" y="60" class="s" style="fill:#2e7d32;text-anchor:middle">→ Predicción final: SÍ</text>
    <text x="75" y="74" class="s" style="text-anchor:middle">(2 vs 1)</text>
  </g>

  <text x="320" y="390" class="s" style="text-anchor:middle">Cada árbol se equivoca en cosas distintas; el promedio compensa y reduce el overfitting.</text>
</svg>
