<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" width="100%" role="img" aria-label="Outliers y escalado antes/después">
  <style>
    .t{font-family:sans-serif;font-size:12px;font-weight:bold;fill:#333}
    .s{font-family:sans-serif;font-size:10px;fill:#555}
    .ax{stroke:#333;stroke-width:1}
    .dot{fill:#1976d2}
    .out{fill:#c62828;stroke:#8e0000;stroke-width:1}
    .norm{fill:#2e7d32}
  </style>

  <!-- OUTLIERS -->
  <text x="150" y="20" class="t" style="text-anchor:middle">Outliers en un box plot</text>
  <g transform="translate(20,40)">
    <line class="ax" x1="0" y1="100" x2="260" y2="100"/>
    <line stroke="#1976d2" stroke-width="1.5" x1="40" y1="100" x2="80" y2="100"/>
    <line stroke="#1976d2" stroke-width="1.5" x1="40" y1="90" x2="40" y2="110"/>
    <rect x="80" y="75" width="80" height="50" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <line stroke="#c62828" stroke-width="2.5" x1="120" y1="75" x2="120" y2="125"/>
    <line stroke="#1976d2" stroke-width="1.5" x1="160" y1="100" x2="200" y2="100"/>
    <line stroke="#1976d2" stroke-width="1.5" x1="200" y1="90" x2="200" y2="110"/>
    <circle class="out" cx="240" cy="100" r="5"/>
    <text x="240" y="88" class="s" style="text-anchor:middle">outlier</text>
    <text x="130" y="150" class="s" style="text-anchor:middle">Fuera de Q1−1.5·IQR o Q3+1.5·IQR = outlier</text>
    <text x="130" y="165" class="s" style="text-anchor:middle">Decisión: eliminar, corregir o conservar</text>
  </g>

  <!-- ESCALADO -->
  <text x="470" y="20" class="t" style="text-anchor:middle">Escalado — por qué normalizar</text>
  <g transform="translate(340,40)">
    <text x="130" y="0" class="s" style="text-anchor:middle">SIN normalizar (edad vs sueldo)</text>
    <line class="ax" x1="10" y1="120" x2="260" y2="120"/>
    <line class="ax" x1="10" y1="20" x2="10" y2="120"/>
    <text x="10" y="132" class="s" style="text-anchor:middle">0</text>
    <text x="260" y="132" class="s" style="text-anchor:end">100000</text>
    <text x="5" y="24" class="s" style="text-anchor:end">100</text>
    <text x="5" y="123" class="s" style="text-anchor:end">0</text>
    <text x="135" y="146" class="s" style="text-anchor:middle">"sueldo" domina toda la distancia</text>
    <circle class="dot" cx="20" cy="115" r="3"/>
    <circle class="dot" cx="60" cy="112" r="3"/>
    <circle class="dot" cx="120" cy="110" r="3"/>
    <circle class="dot" cx="180" cy="108" r="3"/>
    <circle class="dot" cx="240" cy="106" r="3"/>
  </g>

  <g transform="translate(340,210)">
    <text x="130" y="0" class="s" style="fill:#2e7d32;font-weight:bold;text-anchor:middle">↓ con Min-Max o Z-score (misma escala)</text>
    <line class="ax" x1="10" y1="100" x2="260" y2="100"/>
    <line class="ax" x1="10" y1="20" x2="10" y2="100"/>
    <text x="10" y="112" class="s" style="text-anchor:middle">0</text>
    <text x="260" y="112" class="s" style="text-anchor:end">1</text>
    <text x="5" y="24" class="s" style="text-anchor:end">1</text>
    <text x="5" y="103" class="s" style="text-anchor:end">0</text>
    <circle class="norm" cx="30" cy="80" r="3"/>
    <circle class="norm" cx="80" cy="60" r="3"/>
    <circle class="norm" cx="140" cy="45" r="3"/>
    <circle class="norm" cx="190" cy="35" r="3"/>
    <circle class="norm" cx="240" cy="28" r="3"/>
  </g>
</svg>
