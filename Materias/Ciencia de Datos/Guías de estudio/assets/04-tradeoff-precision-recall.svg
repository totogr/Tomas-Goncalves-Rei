<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" width="100%" role="img" aria-label="Trade-off precisión y recall al mover el umbral">
  <style>
    .axis{stroke:#333;stroke-width:1.5;fill:none}
    .prec{stroke:#1976d2;stroke-width:2.5;fill:none}
    .rec{stroke:#c62828;stroke-width:2.5;fill:none}
    .lbl{font-family:sans-serif;font-size:11px;fill:#333}
    .title{font-family:sans-serif;font-size:12px;fill:#333;font-weight:bold}
  </style>
  <text x="240" y="18" text-anchor="middle" class="title">Efecto del umbral sobre precisión y recall</text>
  <line class="axis" x1="60" y1="230" x2="450" y2="230"/>
  <line class="axis" x1="60" y1="40" x2="60" y2="230"/>
  <text x="255" y="258" text-anchor="middle" class="lbl">← umbral bajo         umbral         umbral alto →</text>
  <text x="24" y="135" transform="rotate(-90 24 135)" text-anchor="middle" class="lbl">valor de la métrica</text>
  <text x="55" y="45" text-anchor="end" class="lbl">1</text>
  <text x="55" y="235" text-anchor="end" class="lbl">0</text>
  <path class="prec" d="M 80,210 Q 200,190 280,120 T 430,50"/>
  <path class="rec" d="M 80,55 Q 200,70 280,130 T 430,220"/>
  <line x1="280" y1="40" x2="280" y2="230" stroke="#666" stroke-dasharray="3,3"/>
  <circle cx="280" cy="120" r="4" fill="#1976d2"/>
  <circle cx="280" cy="130" r="4" fill="#c62828"/>
  <text x="290" y="118" class="lbl" fill="#1976d2">precisión</text>
  <text x="290" y="148" class="lbl" fill="#c62828">recall</text>
  <text x="280" y="34" text-anchor="middle" class="lbl">punto de balance (≈ F1)</text>
</svg>
