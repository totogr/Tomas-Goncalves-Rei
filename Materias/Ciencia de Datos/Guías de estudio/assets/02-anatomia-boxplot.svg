<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" width="100%" role="img" aria-label="Anatomía de un box plot">
  <style>
    .lbl{font-family:sans-serif;font-size:11px;fill:#333}
    .lblb{font-family:sans-serif;font-size:11px;fill:#333;font-weight:bold}
    .title{font-family:sans-serif;font-size:13px;font-weight:bold;fill:#333}
    .ax{stroke:#333;stroke-width:1}
    .box{fill:#e3f2fd;stroke:#1565c0;stroke-width:1.5}
    .med{stroke:#c62828;stroke-width:2.5}
    .whis{stroke:#1565c0;stroke-width:1.5}
    .out{fill:#c62828}
    .guide{stroke:#999;stroke-dasharray:3,3}
  </style>
  <text x="260" y="20" text-anchor="middle" class="title">Anatomía de un box plot</text>
  <line class="ax" x1="60" y1="230" x2="500" y2="230"/>
  <text x="60" y="248" text-anchor="middle" class="lbl">0</text>
  <text x="150" y="248" text-anchor="middle" class="lbl">Q1</text>
  <text x="230" y="248" text-anchor="middle" class="lbl">mediana</text>
  <text x="330" y="248" text-anchor="middle" class="lbl">Q3</text>
  <text x="500" y="248" text-anchor="middle" class="lbl">max</text>

  <!-- Bigote izquierdo -->
  <line class="whis" x1="90" y1="130" x2="150" y2="130"/>
  <line class="whis" x1="90" y1="115" x2="90" y2="145"/>
  <!-- Caja -->
  <rect class="box" x="150" y="100" width="180" height="60"/>
  <!-- Mediana -->
  <line class="med" x1="230" y1="100" x2="230" y2="160"/>
  <!-- Bigote derecho -->
  <line class="whis" x1="330" y1="130" x2="400" y2="130"/>
  <line class="whis" x1="400" y1="115" x2="400" y2="145"/>
  <!-- Outliers -->
  <circle class="out" cx="30" cy="130" r="4"/>
  <circle class="out" cx="470" cy="130" r="4"/>
  <circle class="out" cx="490" cy="130" r="4"/>

  <!-- Anotaciones -->
  <line class="guide" x1="150" y1="100" x2="150" y2="230"/>
  <line class="guide" x1="330" y1="100" x2="330" y2="230"/>
  <line class="guide" x1="230" y1="100" x2="230" y2="230"/>

  <text x="240" y="80" text-anchor="middle" class="lblb" fill="#1565c0">IQR = Q3 − Q1</text>
  <text x="240" y="95" text-anchor="middle" class="lbl">(50% central de los datos)</text>

  <text x="90" y="180" text-anchor="middle" class="lbl">bigote inferior</text>
  <text x="90" y="195" text-anchor="middle" class="lbl">(Q1 − 1.5·IQR)</text>
  <text x="400" y="180" text-anchor="middle" class="lbl">bigote superior</text>
  <text x="400" y="195" text-anchor="middle" class="lbl">(Q3 + 1.5·IQR)</text>

  <text x="30" y="115" text-anchor="middle" class="lblb" fill="#c62828">outlier</text>
  <text x="480" y="115" text-anchor="middle" class="lblb" fill="#c62828">outliers</text>
</svg>
