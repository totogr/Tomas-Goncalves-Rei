<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="100%" role="img" aria-label="Curva ROC">
  <style>
    .axis{stroke:#333;stroke-width:1.5;fill:none}
    .grid{stroke:#eee;stroke-width:0.6}
    .lbl{font-family:sans-serif;font-size:11px;fill:#333}
    .title{font-family:sans-serif;font-size:12px;font-weight:bold;fill:#333}
    .diag{stroke:#999;stroke-dasharray:4,4;stroke-width:1}
    .roc-good{stroke:#2e7d32;stroke-width:2.5;fill:rgba(46,125,50,0.12)}
    .roc-mid{stroke:#f57c00;stroke-width:2.5;fill:none}
    .roc-perfect{stroke:#1976d2;stroke-width:2.5;fill:none}
  </style>
  <text x="240" y="18" class="title" style="text-anchor:middle">Curva ROC — cuanto más pega arriba-izquierda, mejor</text>
  <line class="axis" x1="70" y1="270" x2="420" y2="270"/>
  <line class="axis" x1="70" y1="50" x2="70" y2="270"/>
  <g class="grid">
    <line x1="70" y1="215" x2="420" y2="215"/><line x1="70" y1="160" x2="420" y2="160"/><line x1="70" y1="105" x2="420" y2="105"/>
    <line x1="157" y1="50" x2="157" y2="270"/><line x1="245" y1="50" x2="245" y2="270"/><line x1="332" y1="50" x2="332" y2="270"/>
  </g>
  <text x="245" y="298" class="lbl" style="text-anchor:middle">FPR (tasa de falsos positivos)</text>
  <text x="30" y="160" transform="rotate(-90 30 160)" class="lbl" style="text-anchor:middle">TPR (recall)</text>
  <text x="65" y="275" class="lbl" style="text-anchor:end">0</text>
  <text x="420" y="285" class="lbl" style="text-anchor:middle">1</text>
  <text x="65" y="53" class="lbl" style="text-anchor:end">1</text>
  <line class="diag" x1="70" y1="270" x2="420" y2="50"/>
  <path class="roc-perfect" d="M 70,270 L 70,50 L 420,50"/>
  <path class="roc-good" d="M 70,270 Q 95,125 185,78 Q 305,55 420,50 L 420,270 Z"/>
  <path class="roc-mid" d="M 70,270 Q 150,200 245,140 Q 335,90 420,50"/>
  <text x="80" y="66" class="lbl" style="fill:#1976d2">Perfecto (AUC=1)</text>
  <text x="190" y="100" class="lbl" style="fill:#2e7d32">Bueno (AUC≈0.9)</text>
  <text x="238" y="128" class="lbl" style="fill:#f57c00;text-anchor:end">Regular (AUC≈0.75)</text>
  <text x="250" y="200" class="lbl" style="fill:#666">Azar (AUC=0.5)</text>
</svg>
