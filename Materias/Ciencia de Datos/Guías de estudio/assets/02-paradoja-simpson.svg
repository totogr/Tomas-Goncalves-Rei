<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="100%" role="img" aria-label="Paradoja de Simpson">
  <style>
    .t{font-family:sans-serif;font-size:12px;font-weight:bold;fill:#333}
    .s{font-family:sans-serif;font-size:11px;fill:#333}
    .ax{stroke:#333;stroke-width:1}
    .gA{fill:#1976d2}
    .gB{fill:#c62828}
    .trend{stroke-width:2;fill:none}
  </style>
  <text x="280" y="18" text-anchor="middle" class="t">Paradoja de Simpson — la tendencia se invierte al segmentar</text>

  <!-- Panel 1: total -->
  <g transform="translate(20,40)">
    <text x="120" y="0" text-anchor="middle" class="s">Todos los datos juntos</text>
    <line class="ax" x1="20" y1="220" x2="240" y2="220"/>
    <line class="ax" x1="20" y1="20" x2="20" y2="220"/>
    <circle class="gA" cx="40"  cy="200" r="3"/>
    <circle class="gA" cx="60"  cy="185" r="3"/>
    <circle class="gA" cx="80"  cy="170" r="3"/>
    <circle class="gA" cx="100" cy="155" r="3"/>
    <circle class="gA" cx="120" cy="140" r="3"/>
    <circle class="gB" cx="140" cy="120" r="3"/>
    <circle class="gB" cx="160" cy="100" r="3"/>
    <circle class="gB" cx="180" cy="85"  r="3"/>
    <circle class="gB" cx="200" cy="70"  r="3"/>
    <circle class="gB" cx="220" cy="55"  r="3"/>
    <line class="trend" stroke="#2e7d32" x1="20" y1="215" x2="240" y2="55"/>
    <text x="130" y="245" text-anchor="middle" class="s" fill="#2e7d32">tendencia GLOBAL: ↗ sube</text>
  </g>

  <!-- Panel 2: por grupo -->
  <g transform="translate(300,40)">
    <text x="120" y="0" text-anchor="middle" class="s">Separado por grupo</text>
    <line class="ax" x1="20" y1="220" x2="240" y2="220"/>
    <line class="ax" x1="20" y1="20" x2="20" y2="220"/>
    <!-- Grupo A (arriba-izq) -->
    <circle class="gA" cx="40"  cy="90"  r="3"/>
    <circle class="gA" cx="60"  cy="100" r="3"/>
    <circle class="gA" cx="80"  cy="110" r="3"/>
    <circle class="gA" cx="100" cy="120" r="3"/>
    <circle class="gA" cx="120" cy="130" r="3"/>
    <line class="trend" stroke="#1976d2" x1="35" y1="85" x2="125" y2="140"/>
    <text x="140" y="90" class="s" fill="#1976d2">Grupo A ↘</text>
    <!-- Grupo B (abajo-der) -->
    <circle class="gB" cx="140" cy="170" r="3"/>
    <circle class="gB" cx="160" cy="180" r="3"/>
    <circle class="gB" cx="180" cy="190" r="3"/>
    <circle class="gB" cx="200" cy="200" r="3"/>
    <circle class="gB" cx="220" cy="210" r="3"/>
    <line class="trend" stroke="#c62828" x1="135" y1="165" x2="225" y2="215"/>
    <text x="230" y="200" class="s" fill="#c62828">Grupo B ↘</text>
    <text x="130" y="245" text-anchor="middle" class="s" fill="#c62828">CADA grupo baja ↘</text>
  </g>

  <text x="280" y="290" text-anchor="middle" class="s">Los mismos datos "suben" al mirarlos juntos y "bajan" al separarlos → siempre chequear subgrupos.</text>
</svg>
