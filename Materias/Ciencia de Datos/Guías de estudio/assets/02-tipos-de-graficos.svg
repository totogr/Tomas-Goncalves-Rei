<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="100%" role="img" aria-label="Panel con ejemplos de tipos de gráficos">
  <style>
    .t{font-family:sans-serif;font-size:12px;fill:#333;font-weight:bold}
    .s{font-family:sans-serif;font-size:10px;fill:#666}
    .ax{stroke:#333;stroke-width:1;fill:none}
    .bar{fill:#1976d2}
    .bar2{fill:#42a5f5}
    .dot{fill:#c62828}
    .line{stroke:#2e7d32;stroke-width:2;fill:none}
    .box{fill:#fff3e0;stroke:#f57c00;stroke-width:1.2}
    .med{stroke:#c62828;stroke-width:2}
    .whis{stroke:#f57c00;stroke-width:1.2}
    .hist{fill:#7e57c2}
  </style>

  <!-- Histograma -->
  <g transform="translate(20,20)">
    <text x="80" y="10" text-anchor="middle" class="t">Histograma</text>
    <text x="80" y="24" text-anchor="middle" class="s">distribución continua</text>
    <line class="ax" x1="10" y1="180" x2="160" y2="180"/>
    <line class="ax" x1="10" y1="40" x2="10" y2="180"/>
    <rect class="hist" x="14" y="150" width="20" height="30"/>
    <rect class="hist" x="34" y="110" width="20" height="70"/>
    <rect class="hist" x="54" y="70"  width="20" height="110"/>
    <rect class="hist" x="74" y="55"  width="20" height="125"/>
    <rect class="hist" x="94" y="85"  width="20" height="95"/>
    <rect class="hist" x="114" y="130" width="20" height="50"/>
    <rect class="hist" x="134" y="160" width="20" height="20"/>
  </g>

  <!-- Box plot -->
  <g transform="translate(200,20)">
    <text x="80" y="10" text-anchor="middle" class="t">Box plot</text>
    <text x="80" y="24" text-anchor="middle" class="s">cuartiles + outliers</text>
    <line class="ax" x1="10" y1="180" x2="160" y2="180"/>
    <line class="ax" x1="10" y1="40" x2="10" y2="180"/>
    <line class="whis" x1="80" y1="60" x2="80" y2="90"/>
    <line class="whis" x1="70" y1="60" x2="90" y2="60"/>
    <rect class="box" x="55" y="90" width="50" height="60"/>
    <line class="med" x1="55" y1="115" x2="105" y2="115"/>
    <line class="whis" x1="80" y1="150" x2="80" y2="170"/>
    <line class="whis" x1="70" y1="170" x2="90" y2="170"/>
    <circle cx="80" cy="50" r="3" fill="#c62828"/>
    <text x="90" y="53" class="s">outlier</text>
    <text x="112" y="118" class="s">mediana</text>
    <text x="112" y="103" class="s">Q3</text>
    <text x="112" y="145" class="s">Q1</text>
  </g>

  <!-- Scatter -->
  <g transform="translate(380,20)">
    <text x="80" y="10" text-anchor="middle" class="t">Scatter plot</text>
    <text x="80" y="24" text-anchor="middle" class="s">relación X ↔ Y</text>
    <line class="ax" x1="10" y1="180" x2="160" y2="180"/>
    <line class="ax" x1="10" y1="40" x2="10" y2="180"/>
    <circle class="dot" cx="25" cy="165" r="2.5"/>
    <circle class="dot" cx="40" cy="150" r="2.5"/>
    <circle class="dot" cx="55" cy="140" r="2.5"/>
    <circle class="dot" cx="65" cy="120" r="2.5"/>
    <circle class="dot" cx="80" cy="110" r="2.5"/>
    <circle class="dot" cx="95" cy="95"  r="2.5"/>
    <circle class="dot" cx="110" cy="85" r="2.5"/>
    <circle class="dot" cx="125" cy="70" r="2.5"/>
    <circle class="dot" cx="140" cy="55" r="2.5"/>
    <circle class="dot" cx="70" cy="145" r="2.5"/>
    <circle class="dot" cx="100" cy="115" r="2.5"/>
    <circle class="dot" cx="50" cy="130" r="2.5"/>
    <line stroke="#c62828" stroke-dasharray="3,3" x1="15" y1="170" x2="150" y2="55"/>
  </g>

  <!-- Line plot -->
  <g transform="translate(20,220)">
    <text x="80" y="8" text-anchor="middle" class="t">Line plot · serie de tiempo</text>
    <line class="ax" x1="10" y1="30" x2="700" y2="30"/>
    <path class="line" d="M 20,25 L 80,20 L 140,25 L 200,15 L 260,22 L 320,10 L 380,18 L 440,5 L 500,12 L 560,8 L 620,15 L 680,3"/>
  </g>
</svg>
