<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" role="img" aria-label="Métricas DORA equilibrando velocidad y estabilidad">
  <style>
    .t{font-family:sans-serif;font-size:12px;font-weight:bold;fill:#333}
    .s{font-family:sans-serif;font-size:11px;fill:#333}
    .ss{font-family:sans-serif;font-size:10px;fill:#555}
    .vel{fill:#1976d2}
    .est{fill:#2e7d32}
    .box-vel{fill:#e3f2fd;stroke:#1565c0;stroke-width:1.5}
    .box-est{fill:#c8e6c9;stroke:#2e7d32;stroke-width:1.5}
    .beam{stroke:#8d6e63;stroke-width:5;fill:none}
    .base{fill:#8d6e63}
  </style>

  <text x="360" y="20" text-anchor="middle" class="t">Métricas DORA — balance entre velocidad y estabilidad</text>

  <!-- Balanza -->
  <g transform="translate(0,60)">
    <!-- Base -->
    <polygon class="base" points="330,180 390,180 360,140"/>
    <line stroke="#8d6e63" stroke-width="3" x1="360" y1="140" x2="360" y2="80"/>
    <!-- Beam -->
    <line class="beam" x1="130" y1="80" x2="590" y2="80"/>
    <!-- Cadenas -->
    <line stroke="#8d6e63" stroke-width="1.5" x1="150" y1="80" x2="150" y2="120"/>
    <line stroke="#8d6e63" stroke-width="1.5" x1="570" y1="80" x2="570" y2="120"/>
    <!-- Plato izquierdo (velocidad) -->
    <rect class="box-vel" x="30" y="120" width="240" height="90" rx="8"/>
    <text x="150" y="145" text-anchor="middle" class="s" font-weight="bold" fill="#1565c0">🚀 Velocidad</text>
    <text x="150" y="165" text-anchor="middle" class="ss">Deployment Frequency (¿cuántas veces al día/semana?)</text>
    <text x="150" y="181" text-anchor="middle" class="ss">Lead Time for Changes (¿del commit a prod, cuánto?)</text>
    <!-- Plato derecho (estabilidad) -->
    <rect class="box-est" x="450" y="120" width="240" height="90" rx="8"/>
    <text x="570" y="145" text-anchor="middle" class="s" font-weight="bold" fill="#2e7d32">🛡️ Estabilidad</text>
    <text x="570" y="165" text-anchor="middle" class="ss">Change Failure Rate (% de deploys que rompen)</text>
    <text x="570" y="181" text-anchor="middle" class="ss">Time to Restore Service (¿cuánto se tarda en recuperarse?)</text>

    <text x="360" y="240" text-anchor="middle" class="s">Un equipo de "elite performer" (DORA) mueve las 4 métricas a la vez —</text>
    <text x="360" y="255" text-anchor="middle" class="s">no cambia velocidad por estabilidad, mejora ambas.</text>
  </g>
</svg>
