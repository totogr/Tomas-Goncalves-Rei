<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="100%" role="img" aria-label="Métricas DORA equilibrando velocidad y estabilidad">
  <style>
    .t{font-family:sans-serif;font-size:12px;font-weight:bold;fill:#333}
    .s{font-family:sans-serif;font-size:11px;fill:#333}
    .ss{font-family:sans-serif;font-size:10px;fill:#555}
    .vel{fill:#1976d2}
    .est{fill:#2e7d32}
    .box-vel{fill:#e3f2fd;stroke:#1565c0;stroke-width:1.5}
    .box-est{fill:#c8e6c9;stroke:#2e7d32;stroke-width:1.5}
    .beam{stroke:#8d6e63;stroke-width:5;fill:none}
    .base{fill:#8d6e63}
  </style>

  <text x="360" y="20" class="t" style="text-anchor:middle">Métricas DORA — balance entre velocidad y estabilidad</text>

  <!-- Balanza -->
  <g transform="translate(0,60)">
    <!-- Base -->
    <polygon class="base" points="330,180 390,180 360,140"/>
    <line stroke="#8d6e63" stroke-width="3" x1="360" y1="140" x2="360" y2="80"/>
    <!-- Beam -->
    <line class="beam" x1="130" y1="80" x2="590" y2="80"/>
    <!-- Cadenas -->
    <line stroke="#8d6e63" stroke-width="1.5" x1="155" y1="80" x2="155" y2="120"/>
    <line stroke="#8d6e63" stroke-width="1.5" x1="565" y1="80" x2="565" y2="120"/>
    <!-- Plato izquierdo (velocidad) -->
    <rect class="box-vel" x="10" y="120" width="290" height="90" rx="8"/>
    <text x="155" y="145" class="s" style="font-weight:bold;fill:#1565c0;text-anchor:middle">🚀 Velocidad</text>
    <text x="155" y="165" class="ss" style="text-anchor:middle">Deployment Frequency (¿cuántas veces al día/semana?)</text>
    <text x="155" y="181" class="ss" style="text-anchor:middle">Lead Time for Changes (¿del commit a prod, cuánto?)</text>
    <!-- Plato derecho (estabilidad) -->
    <rect class="box-est" x="420" y="120" width="290" height="90" rx="8"/>
    <text x="565" y="145" class="s" style="font-weight:bold;fill:#2e7d32;text-anchor:middle">🛡️ Estabilidad</text>
    <text x="565" y="165" class="ss" style="text-anchor:middle">Change Failure Rate (% de deploys que rompen)</text>
    <text x="565" y="181" class="ss" style="text-anchor:middle">Time to Restore Service (¿cuánto se tarda en recuperarse?)</text>

    <text x="360" y="240" class="s" style="text-anchor:middle">Un equipo de "elite performer" (DORA) mueve las 4 métricas a la vez —</text>
    <text x="360" y="255" class="s" style="text-anchor:middle">no cambia velocidad por estabilidad, mejora ambas.</text>
  </g>
</svg>
