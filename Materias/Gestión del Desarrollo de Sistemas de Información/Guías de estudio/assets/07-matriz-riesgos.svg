<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="100%" role="img" aria-label="Matriz de riesgos probabilidad x impacto">
  <style>
    .t{font-family:sans-serif;font-size:12px;font-weight:bold;fill:#333}
    .s{font-family:sans-serif;font-size:11px;fill:#333}
    .ss{font-family:sans-serif;font-size:10px;fill:#555}
    .verde{fill:#c8e6c9;stroke:#2e7d32;stroke-width:1}
    .amar{fill:#fff9c4;stroke:#fbc02d;stroke-width:1}
    .naranja{fill:#ffe0b2;stroke:#f57c00;stroke-width:1}
    .rojo{fill:#ffcdd2;stroke:#c62828;stroke-width:1}
    .lbl{font-family:sans-serif;font-size:10px;fill:#333;font-weight:bold}
    .dot{fill:#333}
  </style>

  <text x="310" y="20" class="t" style="text-anchor:middle">Matriz de riesgos — Probabilidad × Impacto</text>

  <!-- Ejes -->
  <text x="310" y="360" class="s" style="text-anchor:middle">Impacto →</text>
  <text x="30" y="200" transform="rotate(-90 30 200)" class="s" style="text-anchor:middle">Probabilidad →</text>

  <!-- Etiquetas de impacto -->
  <text x="130" y="345" class="ss" style="text-anchor:middle">Bajo</text>
  <text x="230" y="345" class="ss" style="text-anchor:middle">Medio</text>
  <text x="330" y="345" class="ss" style="text-anchor:middle">Alto</text>
  <text x="430" y="345" class="ss" style="text-anchor:middle">Muy alto</text>

  <!-- Etiquetas de probabilidad -->
  <text x="70" y="305" class="ss" style="text-anchor:end">Baja</text>
  <text x="70" y="235" class="ss" style="text-anchor:end">Media</text>
  <text x="70" y="165" class="ss" style="text-anchor:end">Alta</text>
  <text x="70" y="95" class="ss" style="text-anchor:end">Muy alta</text>

  <!-- Grid 4x4 -->
  <!-- Fila muy baja probabilidad (abajo) -->
  <rect class="verde" x="80" y="280" width="100" height="50"/>
  <rect class="verde" x="180" y="280" width="100" height="50"/>
  <rect class="amar" x="280" y="280" width="100" height="50"/>
  <rect class="naranja" x="380" y="280" width="100" height="50"/>
  <!-- Fila media -->
  <rect class="verde" x="80" y="210" width="100" height="70"/>
  <rect class="amar" x="180" y="210" width="100" height="70"/>
  <rect class="naranja" x="280" y="210" width="100" height="70"/>
  <rect class="rojo" x="380" y="210" width="100" height="70"/>
  <!-- Fila alta -->
  <rect class="amar" x="80" y="140" width="100" height="70"/>
  <rect class="naranja" x="180" y="140" width="100" height="70"/>
  <rect class="rojo" x="280" y="140" width="100" height="70"/>
  <rect class="rojo" x="380" y="140" width="100" height="70"/>
  <!-- Fila muy alta -->
  <rect class="naranja" x="80" y="70" width="100" height="70"/>
  <rect class="rojo" x="180" y="70" width="100" height="70"/>
  <rect class="rojo" x="280" y="70" width="100" height="70"/>
  <rect class="rojo" x="380" y="70" width="100" height="70"/>

  <!-- Riesgos ejemplo (puntos con texto) -->
  <g>
    <circle class="dot" cx="330" cy="175" r="5" fill="#c62828"/>
    <text x="340" y="179" class="lbl">R1</text>
  </g>
  <g>
    <circle class="dot" cx="200" cy="245" r="5" fill="#f57c00"/>
    <text x="210" y="249" class="lbl">R2</text>
  </g>
  <g>
    <circle class="dot" cx="140" cy="305" r="5" fill="#2e7d32"/>
    <text x="150" y="309" class="lbl">R3</text>
  </g>
  <g>
    <circle class="dot" cx="430" cy="105" r="5" fill="#c62828"/>
    <text x="440" y="109" class="lbl">R4</text>
  </g>

  <!-- Leyenda estrategia -->
  <g transform="translate(505,80)">
    <text x="0" y="0" class="s" style="font-weight:bold">Estrategia:</text>
    <rect class="verde" x="0" y="10" width="14" height="14"/><text x="20" y="22" class="ss">aceptar</text>
    <rect class="amar" x="0" y="30" width="14" height="14"/><text x="20" y="42" class="ss">monitorear</text>
    <rect class="naranja" x="0" y="50" width="14" height="14"/><text x="20" y="62" class="ss">mitigar</text>
    <rect class="rojo" x="0" y="70" width="14" height="14"/><text x="20" y="82" class="ss">evitar / plan B</text>
    <text x="0" y="120" class="s" style="font-weight:bold">Riesgos del ejemplo:</text>
    <text x="0" y="138" class="ss">R1: se va el líder técnico</text>
    <text x="0" y="154" class="ss">R2: el cliente cambia el alcance</text>
    <text x="0" y="170" class="ss">R3: se cae el server de dev</text>
    <text x="0" y="186" class="ss">R4: quiebra un proveedor crítico</text>
  </g>
</svg>
